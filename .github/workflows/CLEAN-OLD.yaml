name: Clean up old releases

on:
  #schedule:
  #  - cron: '0 20 * * *'   # 每天 UTC 0 点
  #    timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  clean-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 删除 Release 需要此权限
    steps:
      - name: Delete older releases, keep latest 4
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 4    # 保留最新 4 个 Release（按创建时间排序）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ✅ 必须通过 env 传递