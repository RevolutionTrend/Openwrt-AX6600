name: Clean up old releases

on:
  #schedule:
  #  - cron: '0 0 * * *'   # 每天 UTC 0 点
  workflow_dispatch:

jobs:
  clean-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete older releases, keep latest 4
        uses: dev-drprasad/delete-older-releases@v0.3
        with:
          keep_latest: 4           # 保留最新 4 个 Release（按创建时间排序）
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # 可选：如果你想保留至少 1 个，但 keep_latest=4 已经保证至少保留 4 个