name: Cache-Clean

on:
  #schedule:  # 定时触发已禁用（保留手动/其它触发）
    #- cron: '0 23 * * 6'
      #timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Cache Clean
        run: gh cache delete --all
